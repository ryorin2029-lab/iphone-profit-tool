<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>iPhone転売 利益計算Pro</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial; background:#f6f7fb; margin:0; padding:18px;}
    .card{max-width:520px; margin:0 auto; background:#fff; border-radius:16px; padding:18px; box-shadow:0 8px 24px rgba(0,0,0,.06);}
    h1{font-size:18px; margin:0 0 10px;}
    .row{display:grid; grid-template-columns:1fr; gap:10px; margin:10px 0;}
    label{font-size:12px; color:#555;}
    input,select,button{width:100%; padding:12px; border-radius:12px; border:1px solid #ddd; font-size:16px; box-sizing:border-box;}
    button{border:none; background:#111; color:#fff; font-weight:700;}
    .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
    .pill{padding:10px 12px; background:#f2f3f6; border-radius:12px; font-size:14px;}
    .ok{color:#0a7a2f; font-weight:800;}
    .ng{color:#c62828; font-weight:800;}
    .muted{color:#777; font-size:12px;}
    .big{font-size:20px; font-weight:900;}
  </style>
</head>
<body>
  <div class="card">
    <h1>📱 iPhone転売 利益計算Pro（相場/最大仕入れ/OK判定）</h1>
    <div class="muted">※相場は手動更新（まずはこれでOK）。あとで自動化も可能。</div>

    <div class="row">
      <div>
        <label>機種</label>
        <select id="model"></select>
      </div>

      <div class="grid2">
        <div>
          <label>相場（自動）</label>
          <input id="market" type="number" readonly />
        </div>
        <div>
          <label>最低利益率（%）</label>
          <input id="minMargin" type="number" readonly />
        </div>
      </div>

      <div class="grid2">
        <div>
          <label>販売予定価格（円）</label>
          <input id="sell" type="number" placeholder="例：58000" />
        </div>
        <div>
          <label>送料（円）</label>
          <input id="ship" type="number" value="750" />
        </div>
      </div>

      <div class="grid2">
        <div>
          <label>目標利益（円）</label>
          <input id="target" type="number" value="8000" />
        </div>
        <div>
          <label>仕入れ価格（円）</label>
          <input id="buy" type="number" placeholder="例：42000" />
        </div>
      </div>

      <button id="calcBtn">計算</button>

      <div class="pill">
        手数料（10%）：<span class="big" id="fee">-</span> 円
      </div>
      <div class="pill">
        最大仕入れ可能額（逆算）：<span class="big" id="maxBuy">-</span> 円
      </div>
      <div class="pill">
        実際の利益：<span class="big" id="profit">-</span> 円 / 利益率：<span class="big" id="margin">-</span> %
      </div>
      <div class="pill">
        判定：<span class="big" id="judge">-</span>
      </div>

      <div class="muted">ホーム画面追加：Safari → 共有 →「ホーム画面に追加」</div>
    </div>
  </div>

<script>
  // ★相場データ（あとで増やせます）
  const MARKET = [
    { name:"iPhone11", price:24000, min:15 },
    { name:"iPhone12", price:38000, min:15 },
    { name:"iPhone13", price:52000, min:15 },
    { name:"iPhone14", price:65000, min:15 },
    { name:"iPhone15", price:85000, min:15 },
    { name:"iPhone13 Pro", price:65000, min:15 },
    { name:"iPhone14 Pro", price:85000, min:15 },
    { name:"iPhone15 Pro", price:105000, min:15 }
  ];

  const el = (id)=>document.getElementById(id);

  function yen(n){ return isFinite(n) ? Math.round(n).toString() : "-"; }
  function pct(n){ return isFinite(n) ? (Math.round(n*10)/10).toString() : "-"; }

  function fillModels(){
    const s = el("model");
    s.innerHTML = "";
    MARKET.forEach((m,i)=>{
      const o = document.createElement("option");
      o.value = i;
      o.textContent = `${m.name}（相場 ${m.price}円）`;
      s.appendChild(o);
    });
    s.value = "2"; // default iPhone13
    syncMarket();
  }

  function syncMarket(){
    const m = MARKET[Number(el("model").value)];
    el("market").value = m.price;
    el("minMargin").value = m.min;
    if(!el("sell").value) el("sell").value = m.price; // 初期は相場を販売予定に入れる
  }

  function calc(){
    const sell = Number(el("sell").value);
    const ship = Number(el("ship").value);
    const target = Number(el("target").value);
    const buy = Number(el("buy").value);
    const minMargin = Number(el("minMargin").value);

    const fee = sell * 0.10;
    const maxBuy = sell - fee - ship - target;
    const profit = sell - fee - ship - buy;
    const margin = sell>0 ? (profit / sell * 100) : NaN;

    el("fee").textContent = yen(fee);
    el("maxBuy").textContent = yen(maxBuy);
    el("profit").textContent = yen(profit);
    el("margin").textContent = pct(margin);

    let j = "—";
    if(isFinite(margin)){
      if(profit >= target && margin >= minMargin) j = `<span class="ok">✅ OK</span>`;
      else j = `<span class="ng">❌ NG</span>`;
    }
    el("judge").innerHTML = j;
  }

  el("model").addEventListener("change", syncMarket);
  el("calcBtn").addEventListener("click", calc);

  fillModels();
</script>
</body>
</html>
