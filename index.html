<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iPhone転売100万仕様</title>
<style>
body{font-family:-apple-system;background:#f6f7fb;margin:0;padding:16px;}
.card{max-width:600px;margin:auto;background:#fff;padding:18px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.08);}
h1{font-size:18px;margin:0 0 10px;}
input,select,button{width:100%;padding:12px;border-radius:12px;border:1px solid #ddd;margin:6px 0;font-size:16px;}
button{background:#111;color:#fff;border:none;font-weight:800;}
.bigDecision{font-size:28px;font-weight:900;text-align:center;margin:10px 0;padding:12px;border-radius:12px;}
.ok{background:#e6f7ec;color:#0a7a2f;}
.ng{background:#fdeaea;color:#c62828;}
.warn{color:#c62828;font-weight:800;}
.statBox{background:#f2f3f6;padding:12px;border-radius:12px;margin:6px 0;}
.checks label{display:block;margin:6px 0;font-size:14px;}
</style>
</head>
<body>
<div class="card">
<h1>🔥 iPhone転売 100万仕様</h1>

<div id="decision" class="bigDecision ng">判定待ち</div>

<label>メルカリURL</label>
<input id="url" placeholder="https://jp.mercari.com/item/...">

<label>機種</label>
<select id="model"></select>

<label>販売価格（円）</label>
<input id="sell" type="number">

<label>仕入れ価格（円）</label>
<input id="buy" type="number">

<div class="checks">
<label><input type="checkbox" value="8000"> 画面割れ (-8000)</label>
<label><input type="checkbox" value="3000"> バッテリー80%未満 (-3000)</label>
<label><input type="checkbox" value="10000"> FaceID不良 (-10000)</label>
<label><input type="checkbox" value="15000"> ジャンク (-15000)</label>
<label><input type="checkbox" id="redrom"> 赤ロムリスク（強制NG）</label>
</div>

<button onclick="calc()">判定する</button>

<div class="statBox">最大仕入れ可能額：<b id="maxBuy">-</b> 円</div>
<div class="statBox">利益：<b id="profit">-</b> 円</div>

<div class="statBox">
今月利益：<b id="month">0</b> 円<br>
目標まで：<b id="remain">1000000</b> 円<br>
達成率：<b id="rate">0</b> %
</div>

<div class="statBox">
OK率：<b id="okr">0</b> %
</div>

</div>

<script>
const MARKET=[
{name:"iPhone13",price:52000},
{name:"iPhone14",price:65000},
{name:"iPhone15",price:85000}
];

const FEE=0.1;
const TARGET=8000;
const MONTH_TARGET=1000000;

let history=JSON.parse(localStorage.getItem("hist100")||"[]");

function init(){
const s=document.getElementById("model");
MARKET.forEach((m,i)=>{
let o=document.createElement("option");
o.value=i;
o.textContent=m.name+"（相場"+m.price+"円）";
s.appendChild(o);
});
updateStats();
}
init();

function calc(){
let sell=Number(document.getElementById("sell").value);
let buy=Number(document.getElementById("buy").value);
let m=MARKET[document.getElementById("model").value];
let redrom=document.getElementById("redrom").checked;

let penalty=0;
document.querySelectorAll(".checks input[type=checkbox]").forEach(c=>{
if(c.checked && c.value) penalty+=Number(c.value);
});

let adjMarket=m.price-penalty;
let fee=sell*FEE;
let profit=sell-fee-buy;
let maxBuy=sell-fee-TARGET;

document.getElementById("profit").innerText=Math.round(profit);
document.getElementById("maxBuy").innerText=Math.round(maxBuy);

let decisionBox=document.getElementById("decision");

let ok=false;

if(redrom){
decisionBox.className="bigDecision ng";
decisionBox.innerText="❌ 赤ロムリスク";
}else if(buy<=maxBuy && profit>=TARGET){
decisionBox.className="bigDecision ok";
decisionBox.innerText="🔥 今すぐ買い";
ok=true;
}else{
decisionBox.className="bigDecision ng";
decisionBox.innerText="❌ 見送り";
}

history.push({profit:profit,ok:ok,date:new Date().toISOString()});
localStorage.setItem("hist100",JSON.stringify(history));
updateStats();
}

function updateStats(){
let monthProfit=history.reduce((a,b)=>a+b.profit,0);
document.getElementById("month").innerText=Math.round(monthProfit);
document.getElementById("remain").innerText=Math.max(0,MONTH_TARGET-monthProfit);
document.getElementById("rate").innerText=Math.min(100,Math.round(monthProfit/MONTH_TARGET*100));

let okCount=history.filter(x=>x.ok).length;
let okr=history.length?Math.round(okCount/history.length*100):0;
document.getElementById("okr").innerText=okr;
}
</script>
</body>
</html>
